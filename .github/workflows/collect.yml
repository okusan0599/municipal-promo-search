name: Collect municipal procurement data

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

env:
  APP_DIR: municipal-promo-app 2

concurrency:
  group: municipal-procurement-data-refresh
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: 'municipal-promo-app 2/requirements.txt'

      - name: Install collector dependencies
        run: |
          cd "$APP_DIR"
          pip install -r requirements.txt

      - name: Collect a bounded national batch
        env:
          DISCOVERY_BATCH_SIZE: '25'
          DIRECT_CRAWL_BATCH_SIZE: '12'
          DIRECT_DETAIL_LIMIT: '8'
          DIRECT_HTTP_TIMEOUT: '12'
          DIRECT_HOST_INTERVAL: '0.4'
          KKJ_COUNT_PER_QUERY: '120'
          KKJ_LOOKBACK_DAYS: '180'
          KKJ_TIMEOUT: '25'
        run: |
          cd "$APP_DIR"
          python -m app.jobs.free_cycle

      - name: Commit refreshed JSON when changed
        shell: bash
        run: |
          cd "$APP_DIR"
          if git diff --quiet -- data; then
            echo "No data changes"
            exit 0
          fi
          git config user.name "municipal-data-bot"
          git config user.email "municipal-data-bot@users.noreply.github.com"
          git add data/*.json
          git commit -m "data: refresh municipal procurement feed"
          git push
